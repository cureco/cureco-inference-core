name: Publish CSharp SDK to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.2.0)
        required: true
        type: string
      verify_only:
        description: Verify without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download stable release packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected stable version tag' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'Expected published stable release' }
          gh release download $env:RELEASE_TAG --pattern 'NativeSDK-win-x64.zip' --pattern '*-py3-none-win_amd64.whl' --pattern SHA256SUMS.txt --dir dist
      - name: Verify build inputs
        run: |
          @'
          import hashlib
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          checksums = dict(line.split(maxsplit=1)[::-1] for line in Path('dist/SHA256SUMS.txt').read_text().splitlines() if line.strip())
          checksums = {name.lstrip('*'): digest for name, digest in checksums.items()}
          packages = list(Path('dist').glob('NativeSDK-win-x64.zip'))
          wheels = list(Path('dist').glob('*.whl'))
          assert len(packages) == len(wheels) == 1
          for path in packages + wheels:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == checksums[path.name], path.name
          root = ET.parse('sdk/csharp/Cureco.Inference/Cureco.Inference.csproj').getroot()
          assert root.find('.//Version').text == os.environ['RELEASE_TAG'][1:]
          assert root.find('.//PackageId').text == 'Cureco.Inference.Core'
          print('Verified build inputs')
          '@ | python -
      - name: Build renamed NuGet package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive dist/NativeSDK-win-x64.zip build/native-sdk
          dotnet pack sdk/csharp/Cureco.Inference/Cureco.Inference.csproj -c Release -o dist -p:RuntimeIdentifier=win-x64 "-p:CurecoNativeRuntimeDir=$pwd/build/native-sdk/bin"
      - name: Verify packaged identity and runtime
        run: |
          @'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile
          packages = list(Path('dist').glob('*.nupkg'))
          assert len(packages) == 1
          with zipfile.ZipFile(packages[0]) as archive:
              names = archive.namelist()
              root = ET.fromstring(archive.read(next(n for n in names if n.endswith('.nuspec'))))
              assert root.find('.//{*}metadata/{*}id').text == 'Cureco.Inference.Core'
              assert root.find('.//{*}metadata/{*}version').text == os.environ['RELEASE_TAG'][1:]
              for name in ('lib/net8.0/Cureco.Inference.dll', 'runtimes/win-x64/native/cureco_inference.dll', 'runtimes/win-x64/native/onnxruntime.dll', 'licenses/cureco-LICENSE', 'licenses/onnxruntime-LICENSE', 'licenses/onnxruntime-ThirdPartyNotices.txt', 'licenses/nlohmann-json-LICENSE.MIT'):
                  assert name in names, name
          print('Verified:', packages[0].name)
          '@ | python -
      - name: Test packaged CSharp SDK
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pytest onnx
          python -m pip install (Get-ChildItem dist/*.whl).FullName
          python tests/integration/test_sdk.py build/fixtures
          dotnet build sdk/csharp/Cureco.Inference.Tests/Cureco.Inference.Tests.csproj -c Release -r win-x64 "-p:RestoreAdditionalProjectSources=$pwd/dist"
          dotnet sdk/csharp/Cureco.Inference.Tests/bin/Release/net8.0/win-x64/Cureco.Inference.Tests.dll build/fixtures/classification.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: verified-nuget-package
          path: dist/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-test-fixture
          path: build/fixtures/classification.onnx
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Cureco.Inference.Core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-nuget-package
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check publishing account configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Configure the NUGET_USER repository variable with the NuGet.org profile name.'; exit 1; }
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  install-from-nuget:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/fresh-packages
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-test-fixture
          path: fixture
      - name: Restore from NuGet.org and test installed SDK
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $project = 'sdk/csharp/Cureco.Inference.Tests/Cureco.Inference.Tests.csproj'
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            dotnet restore $project -r win-x64 --no-cache --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 19) { throw 'Published package not available from NuGet.org' }
            Start-Sleep -Seconds 30
          }
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build $project -c Release -r win-x64 --no-restore
          dotnet sdk/csharp/Cureco.Inference.Tests/bin/Release/net8.0/win-x64/Cureco.Inference.Tests.dll fixture/classification.onnx
