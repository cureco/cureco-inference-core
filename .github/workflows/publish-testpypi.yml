name: Publish Python SDK to TestPyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        type: string
      verify_only:
        description: Verify without publishing
        type: boolean
        default: false
      auth_only:
        description: Check Trusted Publishing authentication without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

jobs:
  authenticate:
    if: ${{ inputs.auth_only }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/check_pypi_auth.py testpypi
  verify:
    if: ${{ !inputs.auth_only && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease) }}
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download release wheel
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?$') { throw 'Expected version tag' }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($release.isDraft) { throw 'Expected published release' }
          gh release download $env:RELEASE_TAG --pattern '*-py3-none-win_amd64.whl' --pattern SHA256SUMS.txt --dir dist
      - name: Verify checksum and package identity
        run: |
          @'
          import email
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, 'Expected one Windows x64 wheel'
          wheel = wheels[0]
          checksums = dict(line.split(maxsplit=1)[::-1] for line in Path('dist/SHA256SUMS.txt').read_text().splitlines() if line.strip())
          checksums = {name.lstrip('*'): digest for name, digest in checksums.items()}
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == checksums[wheel.name], 'Checksum mismatch'
          with zipfile.ZipFile(wheel) as archive:
              metadata = email.message_from_bytes(archive.read(next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))))
              assert metadata['Name'] == 'cureco-inference-core'
              assert metadata['Version'] == os.environ['RELEASE_TAG'][1:]
              assert any(n.endswith('/_native/cureco_inference.dll') for n in archive.namelist())
          print('Verified:', wheel.name)
          '@ | python -
      - name: Test the distribution
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install twine pytest onnx
          python -m twine check --strict dist/*.whl
          python -m pip install (Get-ChildItem dist/*.whl).FullName
          python -m pytest tests/integration sdk/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: verified-testpypi-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-test:
    needs: verify
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cureco-inference-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-testpypi-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  install-from-testpypi:
    needs: publish-test
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-testpypi-wheel
          path: verified
      - name: Install dependencies from PyPI
        run: python -m pip install numpy Pillow pytest onnx
      - name: Download published wheel from TestPyPI and compare
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:RELEASE_TAG.Substring(1)
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            python -m pip download --no-deps --no-cache-dir --only-binary=:all: --index-url https://test.pypi.org/simple "cureco-inference-core==$version" --dest downloaded
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw 'Published wheel not available from TestPyPI' }
            Start-Sleep -Seconds 10
          }
          $PSNativeCommandUseErrorActionPreference = $true
          $expected = @(Get-ChildItem verified/*.whl)
          $actual = @(Get-ChildItem downloaded/*.whl)
          if ($expected.Count -ne 1 -or $actual.Count -ne 1) { throw 'Expected exactly one wheel' }
          if ((Get-FileHash $expected[0].FullName).Hash -ne (Get-FileHash $actual[0].FullName).Hash) { throw 'Published wheel differs from verified wheel' }
          python -m pip install --no-deps $actual[0].FullName
      - name: Test installed SDK
        run: python -m pytest tests/integration sdk/python/tests -q
